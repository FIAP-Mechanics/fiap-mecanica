name: mecanica

x-app-common: &app-common
  restart: unless-stopped
  mem_limit: 384m
  environment: &app-environment
    SPRING_DATASOURCE_USERNAME: ${MECANICA_POSTGRES_USER:?Defina MECANICA_POSTGRES_USER no arquivo .env}
    SPRING_DATASOURCE_PASSWORD: ${MECANICA_POSTGRES_PASSWORD:?Defina MECANICA_POSTGRES_PASSWORD no arquivo .env}
    JWT_SECRET: ${MECANICA_JWT_SECRET:?Defina MECANICA_JWT_SECRET com pelo menos 32 caracteres no arquivo .env}
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0
    OBSERVABILITY_EXPORT_ENABLED: ${OBSERVABILITY_EXPORT_ENABLED:-false}
    NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otlp.nr-data.net}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-compose}
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:$${SERVER_PORT}/actuator/health/readiness > /dev/null"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  postgres-mecanica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MECANICA_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${MECANICA_POSTGRES_USER:?Defina MECANICA_POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${MECANICA_POSTGRES_PASSWORD:?Defina MECANICA_POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres-mecanica-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  cliente:
    <<: *app-common
    image: mecanica/cliente:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: cliente
    environment:
      <<: *app-environment
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_cliente
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8081:8081"

  veiculo:
    <<: *app-common
    image: mecanica/veiculo:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: veiculo
    environment:
      <<: *app-environment
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_veiculo
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8082:8082"

  funcionario:
    <<: *app-common
    image: mecanica/funcionario:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: funcionario
    environment:
      <<: *app-environment
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_funcionario
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8083:8083"

  servico:
    <<: *app-common
    image: mecanica/servico:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: servico
    environment:
      <<: *app-environment
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_servico
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8084:8084"

  estoque:
    <<: *app-common
    image: mecanica/estoque:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: estoque
    environment:
      <<: *app-environment
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_estoque
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8085:8085"

  atendimento:
    <<: *app-common
    image: mecanica/atendimento:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: atendimento
    environment:
      <<: *app-environment
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_atendimento
      CLIENTE_SERVICE_URL: http://cliente:8081
      VEICULO_SERVICE_URL: http://veiculo:8082
      FUNCIONARIO_SERVICE_URL: http://funcionario:8083
      SERVICO_SERVICE_URL: http://servico:8084
      ESTOQUE_SERVICE_URL: http://estoque:8085
      JWT_EXPIRATION_SECONDS: ${MECANICA_JWT_EXPIRATION_SECONDS:-3600}
      JWT_ISSUER: ${MECANICA_JWT_ISSUER:-http://localhost:8086}
      ADMIN_EMAIL: ${MECANICA_ADMIN_EMAIL:-admin@mecanica.com}
      ADMIN_PASSWORD: ${MECANICA_ADMIN_PASSWORD:-admin123}
      ADMIN_NOME: ${MECANICA_ADMIN_NOME:-Administrador Padrão}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      NOTIFICACAO_EMAIL_ADMIN: ${NOTIFICACAO_EMAIL_ADMIN:-skip}
      NOTIFICACAO_EMAIL_REMETENTE: ${NOTIFICACAO_EMAIL_REMETENTE:-skip}
    depends_on:
      postgres-mecanica:
        condition: service_healthy
      cliente:
        condition: service_healthy
      veiculo:
        condition: service_healthy
      funcionario:
        condition: service_healthy
      servico:
        condition: service_healthy
      estoque:
        condition: service_healthy
    ports:
      - "8086:8086"

  # Cria a view v_cliente_autenticacao e o usuário somente leitura da function, depois que o cliente criou a tabela.
  auth-cpf-db-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until psql -tAc "select 1 from information_schema.columns where table_name='cliente' and column_name='ativo'" | grep -q 1; do
          sleep 3
        done
        psql -v ON_ERROR_STOP=1 -v ro_password="$$AUTH_CPF_DB_PASSWORD" -f /sql/auth-cpf-view.sql
    environment:
      PGHOST: postgres-mecanica
      PGDATABASE: mecanica_cliente
      PGUSER: ${MECANICA_POSTGRES_USER:?Defina MECANICA_POSTGRES_USER no arquivo .env}
      PGPASSWORD: ${MECANICA_POSTGRES_PASSWORD:?Defina MECANICA_POSTGRES_PASSWORD no arquivo .env}
      AUTH_CPF_DB_PASSWORD: ${MECANICA_AUTH_CPF_DB_PASSWORD:-auth_cpf_ro}
    volumes:
      - ./k8s/addons/auth-cpf/base/auth-cpf-view.sql:/sql/auth-cpf-view.sql:ro
    depends_on:
      cliente:
        condition: service_healthy

  # Function serverless de autenticação por CPF: mesma imagem da AWS Lambda, executada com o Runtime Interface Emulator.
  auth-cpf:
    image: mecanica/auth-cpf:local
    build:
      context: ./functions/auth-cpf
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DB_HOST: postgres-mecanica
      DB_PORT: 5432
      DB_NAME: mecanica_cliente
      DB_USER: auth_cpf_ro
      DB_PASSWORD: ${MECANICA_AUTH_CPF_DB_PASSWORD:-auth_cpf_ro}
      JWT_SECRET: ${MECANICA_JWT_SECRET:?Defina MECANICA_JWT_SECRET com pelo menos 32 caracteres no arquivo .env}
      JWT_ISSUER: ${MECANICA_JWT_ISSUER:-http://localhost:8086}
      JWT_EXPIRATION_SECONDS: ${MECANICA_JWT_EXPIRATION_SECONDS:-3600}
    depends_on:
      auth-cpf-db-init:
        condition: service_completed_successfully

  # API Gateway: mesma configuração usada no Kubernetes (k8s/addons/kong), renderizada na partida.
  kong:
    image: kong:3.9@sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631
    restart: unless-stopped
    mem_limit: 512m
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed -e "s|__JWT_ISSUER__|$$JWT_ISSUER|g" -e "s|__JWT_SECRET__|$$JWT_SECRET|g" -e "s|__CORS_ORIGIN__|*|g" \
          -e "s|__LAMBDA_HOST__|auth-cpf|g" -e "s|__LAMBDA_PORT__|8080|g" -e "s|__LAMBDA_FUNCTION__|function|g" \
          -e "s|__LAMBDA_REGION__|us-east-1|g" -e "s|__LAMBDA_AWS_KEY__|local|g" -e "s|__LAMBDA_AWS_SECRET__|local|g" \
          -e "s|__LAMBDA_DISABLE_HTTPS__|true|g" \
          -e "s|__OTEL_ENABLED__|$${OBSERVABILITY_EXPORT_ENABLED:-false}|g" \
          -e "s|__OTEL_TRACES_ENDPOINT__|$${OTLP_ENDPOINT:-http://localhost:4318}/v1/traces|g" \
          -e "s|__OTEL_API_KEY__|$$NEW_RELIC_LICENSE_KEY|g" \
          -e "s|__DEPLOYMENT_ENVIRONMENT__|$${DEPLOYMENT_ENVIRONMENT:-compose}|g" \
          /template/kong.yml.tpl > /tmp/kong.yml
        if [ -z "$$NEW_RELIC_LICENSE_KEY" ]; then
          sed -i -e '/^      headers:$$/,/^        api-key:/d' /tmp/kong.yml
        fi
        exec /docker-entrypoint.sh kong docker-start
    environment:
      JWT_SECRET: ${MECANICA_JWT_SECRET:?Defina MECANICA_JWT_SECRET com pelo menos 32 caracteres no arquivo .env}
      JWT_ISSUER: ${MECANICA_JWT_ISSUER:-http://localhost:8086}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_PROXY_ACCESS_LOG: /dev/stdout json_fmt
      KONG_NGINX_HTTP_LOG_FORMAT: >-
        json_fmt escape=json '{"timestamp":"$$time_iso8601","service.name":"kong-gateway","metodo":"$$request_method","rota":"$$uri","status":"$$status","duracao_s":"$$request_time","request_id":"$$sent_http_x_request_id","upstream_status":"$$upstream_status","remote_addr":"$$remote_addr"}'
      KONG_TRACING_INSTRUMENTATIONS: request
      OBSERVABILITY_EXPORT_ENABLED: ${OBSERVABILITY_EXPORT_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-https://otlp.nr-data.net}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-compose}
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./k8s/addons/kong/base/kong.yml.tpl:/template/kong.yml.tpl:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health || curl --fail --silent http://localhost:8100/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      atendimento:
        condition: service_healthy
      auth-cpf:
        condition: service_started
    ports:
      - "8080:8000"

volumes:
  postgres-mecanica-data:
