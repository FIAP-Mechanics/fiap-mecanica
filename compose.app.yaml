name: mecanica

x-app-common: &app-common
  restart: unless-stopped
  mem_limit: 384m
  environment: &app-environment
    SPRING_DATASOURCE_USERNAME: mecanica
    SPRING_DATASOURCE_PASSWORD: mecanica
    JWT_SECRET: 0123456789abcdef0123456789abcdef
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=20.0

services:
  postgres-mecanica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: mecanica
      POSTGRES_PASSWORD: mecanica
    volumes:
      - postgres-mecanica-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  cliente:
    <<: *app-common
    image: mecanica/cliente:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: cliente
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_cliente
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8081:8081"

  veiculo:
    <<: *app-common
    image: mecanica/veiculo:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: veiculo
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_veiculo
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8082:8082"

  funcionario:
    <<: *app-common
    image: mecanica/funcionario:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: funcionario
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_funcionario
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8083:8083"

  servico:
    <<: *app-common
    image: mecanica/servico:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: servico
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_servico
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8084:8084"

  estoque:
    <<: *app-common
    image: mecanica/estoque:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: estoque
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_estoque
    depends_on:
      postgres-mecanica:
        condition: service_healthy
    ports:
      - "8085:8085"

  atendimento:
    <<: *app-common
    image: mecanica/atendimento:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: atendimento
    environment:
      <<: *app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-mecanica:5432/mecanica_atendimento
      CLIENTE_SERVICE_URL: http://cliente:8081
      VEICULO_SERVICE_URL: http://veiculo:8082
      FUNCIONARIO_SERVICE_URL: http://funcionario:8083
      SERVICO_SERVICE_URL: http://servico:8084
      ESTOQUE_SERVICE_URL: http://estoque:8085
      ADMIN_EMAIL: admin@mecanica.com
      ADMIN_PASSWORD: admin123
      ADMIN_NOME: Administrador Padrão
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      NOTIFICACAO_EMAIL_ADMIN: ${NOTIFICACAO_EMAIL_ADMIN:-skip}
      NOTIFICACAO_EMAIL_REMETENTE: ${NOTIFICACAO_EMAIL_REMETENTE:-skip}
    depends_on:
      postgres-mecanica:
        condition: service_healthy
      cliente:
        condition: service_started
      veiculo:
        condition: service_started
      funcionario:
        condition: service_started
      servico:
        condition: service_started
      estoque:
        condition: service_started
    ports:
      - "8086:8086"

volumes:
  postgres-mecanica-data:
