services:
  postgres-servico:
    image: 'postgres:latest'
    container_name: postgres-servico
    environment:
      - 'POSTGRES_DB=mecanica_servico'
      - 'POSTGRES_USER=mecanica'
      - 'POSTGRES_PASSWORD=mecanica'
    ports:
      - '5435:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica_servico"]
      interval: 10s
      timeout: 5s
      retries: 5
