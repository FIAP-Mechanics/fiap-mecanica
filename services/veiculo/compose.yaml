services:
  postgres-veiculo:
    image: 'postgres:latest'
    container_name: postgres-veiculo
    environment:
      - 'POSTGRES_DB=mecanica_veiculo'
      - 'POSTGRES_USER=mecanica'
      - 'POSTGRES_PASSWORD=mecanica'
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica_veiculo"]
      interval: 10s
      timeout: 5s
      retries: 5
