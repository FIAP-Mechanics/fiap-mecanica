services:
  postgres-cliente:
    image: 'postgres:latest'
    container_name: postgres-cliente
    environment:
      - 'POSTGRES_DB=mecanica_cliente'
      - 'POSTGRES_USER=mecanica'
      - 'POSTGRES_PASSWORD=mecanica'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica_cliente"]
      interval: 10s
      timeout: 5s
      retries: 5
