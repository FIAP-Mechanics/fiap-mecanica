spring:
  application:
    name: atendimento-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/mecanica_atendimento}
    username: ${SPRING_DATASOURCE_USERNAME:mecanica}
    password: ${SPRING_DATASOURCE_PASSWORD:mecanica}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s

server:
  port: 8086
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    enable:
      spring:
        security: false
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OBSERVABILITY_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: ${OBSERVABILITY_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/metrics
        step: 60s
        aggregation-temporality: delta
        histogram-flavor: base2-exponential-bucket-histogram
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
  opentelemetry:
    resource-attributes:
      "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/traces
          headers:
            api-key: ${NEW_RELIC_LICENSE_KEY:}

logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
      rename:
        traceId: trace.id
        spanId: span.id
      add:
        "[service.name]": ${spring.application.name}
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:http://localhost:8086}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@mecanica.com}
    password: ${ADMIN_PASSWORD:admin123}
    nome: ${ADMIN_NOME:Administrador Padrão}

notificacao:
  email-atualizacoes: ${NOTIFICACAO_EMAIL_ADMIN:skip}
  email-remetente: ${NOTIFICACAO_EMAIL_REMETENTE:skip}

clients:
  cliente-service:
    base-url: ${CLIENTE_SERVICE_URL:http://localhost:8081}
  veiculo-service:
    base-url: ${VEICULO_SERVICE_URL:http://localhost:8082}
  servico-service:
    base-url: ${SERVICO_SERVICE_URL:http://localhost:8084}
  estoque-service:
    base-url: ${ESTOQUE_SERVICE_URL:http://localhost:8085}
