spring:
  application:
    name: funcionario-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/mecanica_funcionario}
    username: ${SPRING_DATASOURCE_USERNAME:mecanica}
    password: ${SPRING_DATASOURCE_PASSWORD:mecanica}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    enable:
      spring:
        security: false
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OBSERVABILITY_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: ${OBSERVABILITY_EXPORT_ENABLED:false}
        url: ${OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/metrics
        step: 60s
        aggregation-temporality: delta
        histogram-flavor: base2-exponential-bucket-histogram
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
  opentelemetry:
    resource-attributes:
      "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/traces
          headers:
            api-key: ${NEW_RELIC_LICENSE_KEY:}

logging:
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
      rename:
        traceId: trace.id
        spanId: span.id
      add:
        "[service.name]": ${spring.application.name}
        "[deployment.environment]": ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
