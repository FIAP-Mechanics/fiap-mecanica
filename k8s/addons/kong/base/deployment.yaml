apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Gera o kong.yml final injetando issuer e segredo JWT, sem deixá-los em ConfigMap.
      - name: render-config
        image: python:3.13-alpine
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        args:
        - |
          import json
          import os
          from pathlib import Path

          template = Path('/template/kong.yml.tpl').read_text()
          if not os.getenv('LAMBDA_AWS_KEY'):
              template = '\n'.join(line for line in template.split('\n')
                                   if not line.strip().startswith(('aws_key:', 'aws_secret:')))
          if not os.getenv('OTEL_API_KEY'):
              template = template.replace('      headers:\n        api-key: "__OTEL_API_KEY__"\n', '')

          values = {key: os.getenv(key, '') for key in (
              'JWT_ISSUER', 'JWT_SECRET', 'CORS_ORIGIN', 'LAMBDA_HOST',
              'LAMBDA_PORT', 'LAMBDA_FUNCTION', 'LAMBDA_REGION',
              'LAMBDA_AWS_KEY', 'LAMBDA_AWS_SECRET', 'LAMBDA_DISABLE_HTTPS',
              'OTEL_ENABLED', 'OTEL_TRACES_ENDPOINT', 'OTEL_API_KEY',
              'DEPLOYMENT_ENVIRONMENT')}
          if os.getenv('OTLP_ENDPOINT'):
              values['OTEL_TRACES_ENDPOINT'] = os.environ['OTLP_ENDPOINT'].rstrip('/') + '/v1/traces'
          if not values['OTEL_API_KEY']:
              values['OTEL_ENABLED'] = 'false'
          plain = {'LAMBDA_PORT', 'LAMBDA_DISABLE_HTTPS', 'OTEL_ENABLED'}
          for key, value in values.items():
              escaped = value if key in plain else json.dumps(value, ensure_ascii=False)[1:-1]
              template = template.replace(f'__{key}__', escaped)
          Path('/config/kong.yml').write_text(template)
        env:
        - name: CORS_ORIGIN
          value: "*"
        - name: LAMBDA_HOST
          value: auth-cpf
        - name: LAMBDA_PORT
          value: "8080"
        - name: LAMBDA_FUNCTION
          value: function
        - name: LAMBDA_REGION
          value: us-east-1
        - name: LAMBDA_AWS_KEY
          value: local
        - name: LAMBDA_AWS_SECRET
          value: local
        - name: LAMBDA_DISABLE_HTTPS
          value: "true"
        - name: OTEL_ENABLED
          value: "false"
        - name: OTEL_TRACES_ENDPOINT
          value: http://localhost:4318/v1/traces
        - name: OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: OTLP_ENDPOINT
              optional: true
        - name: OTEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: newrelic-secrets
              key: NEW_RELIC_LICENSE_KEY
              optional: true
        - name: DEPLOYMENT_ENVIRONMENT
          value: local
        - name: JWT_ISSUER
          valueFrom:
            configMapKeyRef:
              name: atendimento-config
              key: JWT_ISSUER
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: JWT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: template
          mountPath: /template
          readOnly: true
        - name: config
          mountPath: /config
      containers:
      - name: kong
        image: kong:3.9@sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631
        imagePullPolicy: IfNotPresent
        env:
        - name: KONG_DATABASE
          value: "off"
        # "auto" cria um worker por core do nó; com limite de 512Mi isso estoura a memória (OOMKilled).
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "2"
        - name: KONG_PREFIX
          value: /kong-prefix
        - name: KONG_DECLARATIVE_CONFIG
          value: /config/kong.yml
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_ADMIN_LISTEN
          value: "off"
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout json_fmt
        - name: KONG_NGINX_HTTP_LOG_FORMAT
          value: >-
            json_fmt escape=json '{"timestamp":"$time_iso8601","service.name":"kong-gateway","metodo":"$request_method","rota":"$uri","status":"$status","duracao_s":"$request_time","request_id":"$sent_http_x_request_id","upstream_status":"$upstream_status","remote_addr":"$remote_addr"}'
        - name: KONG_TRACING_INSTRUMENTATIONS
          value: request
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_LOG_LEVEL
          value: notice
        ports:
        - name: proxy
          containerPort: 8000
        - name: status
          containerPort: 8100
        readinessProbe:
          httpGet:
            path: /status/ready
            port: status
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /status
            port: status
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: prefix
          mountPath: /kong-prefix
      volumes:
      - name: template
        configMap:
          name: kong-config
      - name: config
        emptyDir:
          medium: Memory
      - name: prefix
        emptyDir: {}
