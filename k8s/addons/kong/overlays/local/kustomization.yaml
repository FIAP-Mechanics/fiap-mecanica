apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mecanica

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: kong
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Deployment
      name: kong
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
