apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: kong
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Deployment
      name: kong
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kong
      spec:
        template:
          spec:
            initContainers:
            - name: render-config
              env:
              - name: LAMBDA_HOST
                value: lambda.us-east-1.amazonaws.com
              - name: LAMBDA_PORT
                value: "443"
              - name: LAMBDA_REGION
                value: us-east-1
              - name: LAMBDA_DISABLE_HTTPS
                value: "false"
              - name: LAMBDA_AWS_KEY
                value: ""
              - name: LAMBDA_AWS_SECRET
                value: ""
              - name: OTEL_ENABLED
                value: "true"
            containers:
            - name: kong
              env:
              - name: KONG_REAL_IP_HEADER
                value: X-Forwarded-For
