apiVersion: batch/v1
kind: Job
metadata:
  name: auth-cpf-db-init
  labels:
    app.kubernetes.io/name: auth-cpf-db-init
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-cpf-db-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: psql
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - |
          until psql -tAc "select 1 from information_schema.columns where table_name='cliente' and column_name='ativo'" | grep -q 1; do
            sleep 3
          done
          psql -v ON_ERROR_STOP=1 -v ro_password="$AUTH_CPF_DB_PASSWORD" -f /sql/auth-cpf-view.sql
        env:
        - name: PGHOST
          value: postgres-mecanica
        - name: PGDATABASE
          value: mecanica_cliente
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_USERNAME
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_PASSWORD
        - name: AUTH_CPF_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-cpf-secrets
              key: AUTH_CPF_DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: sql
          mountPath: /sql
          readOnly: true
      volumes:
      - name: sql
        configMap:
          name: auth-cpf-view-sql
