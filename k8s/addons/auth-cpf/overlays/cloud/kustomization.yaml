apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: auth-cpf
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-cpf
  - target:
      kind: Service
      name: auth-cpf
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: auth-cpf
