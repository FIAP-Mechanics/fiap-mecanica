apiVersion: apps/v1
kind: Deployment
metadata:
  name: atendimento
  labels:
    app.kubernetes.io/name: atendimento
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atendimento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atendimento
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgresql
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until pg_isready -h postgres-mecanica -p 5432; do sleep 2; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: atendimento
        image: mecanica/atendimento:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8086
          protocol: TCP
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: atendimento-config
        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: JWT_SECRET
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: atendimento-secrets
              key: ADMIN_EMAIL
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atendimento-secrets
              key: ADMIN_PASSWORD
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: atendimento-secrets
              key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atendimento-secrets
              key: MAIL_PASSWORD
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 750m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
