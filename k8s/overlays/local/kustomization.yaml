apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mecanica

resources:
  - ../../base
  # Kong fica aqui (e não aplicado à parte) para o Kustomize reescrever o nome com hash do Secret mecanica-shared-secrets.
  - ../../addons/kong/overlays/local

secretGenerator:
  - name: mecanica-shared-secrets
    envs:
      - secrets/shared.env
  - name: atendimento-secrets
    envs:
      - secrets/atendimento.env
  - name: external-services-secrets
    envs:
      - secrets/external-services.env

images:
  - name: mecanica/cliente
    newTag: local
  - name: mecanica/veiculo
    newTag: local
  - name: mecanica/funcionario
    newTag: local
  - name: mecanica/servico
    newTag: local
  - name: mecanica/estoque
    newTag: local
  - name: mecanica/atendimento
    newTag: local
