apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-databases
  labels:
    app.kubernetes.io/name: postgres-mecanica
    app.kubernetes.io/part-of: oficina-mecanica
data:
  init-databases.sql: |
    CREATE DATABASE mecanica_cliente;
    CREATE DATABASE mecanica_veiculo;
    CREATE DATABASE mecanica_funcionario;
    CREATE DATABASE mecanica_servico;
    CREATE DATABASE mecanica_estoque;
    CREATE DATABASE mecanica_atendimento;
