apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-mecanica
  labels:
    app.kubernetes.io/name: postgres-mecanica
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  serviceName: postgres-mecanica-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-mecanica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-mecanica
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mecanica-shared-secrets
              key: DATABASE_PASSWORD
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-databases
          mountPath: /docker-entrypoint-initdb.d/init-databases.sql
          subPath: init-databases.sql
          readOnly: true
      volumes:
      - name: init-databases
        configMap:
          name: postgres-init-databases
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: postgres-mecanica
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
