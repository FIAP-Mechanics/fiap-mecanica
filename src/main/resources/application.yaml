spring:
  application:
    name: mecanica
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/mecanica
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
notificacao:
  email-atualizacoes: ${NOTIFICACAO_EMAIL_ADMIN:skip}
  email-remetente: ${NOTIFICACAO_EMAIL_REMETENTE:skip}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: ${JWT_ISSUER:http://localhost:8080}
app:
  admin:
    email: ${ADMIN_EMAIL:admin@mecanica.com}
    password: ${ADMIN_PASSWORD:admin123}
    nome: ${ADMIN_NOME:Administrador Padrão}
