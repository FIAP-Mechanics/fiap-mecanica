services:
  postgres:
    image: 'postgres:latest'
    container_name: postgres-db
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fiap-mecanica-app
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_SECONDS=${JWT_EXPIRATION_SECONDS:-3600}
      - JWT_ISSUER=${JWT_ISSUER:-http://localhost:8080}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mecanica.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_NOME=${ADMIN_NOME:-Administrador Padrão}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-seu-email@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-sua-senha-de-app}
      - NOTIFICACAO_EMAIL_ADMIN=${NOTIFICACAO_EMAIL_ADMIN:-skip}
      - NOTIFICACAO_EMAIL_REMETENTE=${NOTIFICACAO_EMAIL_REMETENTE:-skip}
    depends_on:
      postgres:
        condition: service_healthy
