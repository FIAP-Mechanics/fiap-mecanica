openapi: 3.0.3
info:
  title: Autenticação por CPF - Oficina Mecânica
  description: Function serverless que valida o CPF, consulta o cliente e devolve um JWT para as APIs protegidas.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway (Kong) local
paths:
  /auth/cpf:
    post:
      summary: Autenticar cliente por CPF
      operationId: autenticarPorCpf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutenticarCpfRequest"
      responses:
        "200":
          description: Cliente ativo autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400":
          description: CPF ausente ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "401":
          description: Cliente inexistente ou inativo (mesma resposta nos dois casos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
        "429":
          description: Limite de 20 requisições por minuto por IP excedido
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaErro"
components:
  schemas:
    AutenticarCpfRequest:
      type: object
      required: [cpf]
      properties:
        cpf:
          type: string
          example: 529.982.247-25
          description: CPF com ou sem máscara
    Token:
      type: object
      properties:
        access_token:
          type: string
          description: JWT HS256 com claims iss, sub, cliente_id, roles ["CLIENTE"], iat e exp
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
    RespostaErro:
      type: object
      properties:
        erros:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
                example: nao-autorizado
              mensagem:
                type: string
