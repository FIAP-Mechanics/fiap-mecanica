name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service:
          - cliente
          - veiculo
          - funcionario
          - servico
          - estoque
          - atendimento

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: troque-por-uma-secret-com-pelo-menos-32-caracteres
        run: ./mvnw -B -pl services/${{ matrix.service }} -am verify

      - name: Upload JaCoCo coverage report - ${{ matrix.service }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn