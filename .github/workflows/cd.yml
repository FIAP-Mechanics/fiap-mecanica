name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        service:
          - cliente
          - veiculo
          - funcionario
          - servico
          - estoque
          - atendimento

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: troque-por-uma-secret-com-pelo-menos-32-caracteres
        run: ./mvnw -B -pl services/${{ matrix.service }} -am verify

      - name: Compute image vars
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-${{ matrix.service }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-${{ matrix.service }}:latest

  provision-and-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Create sandbox secrets for the ephemeral cluster
        run: |
          cp k8s/overlays/local/secrets/shared.env.example k8s/overlays/local/secrets/shared.env
          cp k8s/overlays/local/secrets/atendimento.env.example k8s/overlays/local/secrets/atendimento.env
          cp k8s/overlays/local/secrets/external-services.env.example k8s/overlays/local/secrets/external-services.env

      - name: Terraform apply (cluster kind efêmero + PostgreSQL)
        id: terraform_apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
          terraform output -raw kubeconfig > kubeconfig.yaml

      - name: Point kubectl at the ephemeral cluster
        run: echo "KUBECONFIG=${{ github.workspace }}/infra/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Configure GHCR pull credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=mecanica \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -
          kubectl patch serviceaccount default \
            --namespace=mecanica \
            --type=merge \
            --patch='{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

      - name: Install Metrics Server
        run: kubectl apply -k k8s/addons/metrics-server/overlays/local

      - name: Point local overlay at the images just published
        working-directory: k8s/overlays/local
        run: |
          kustomize edit set image \
            mecanica/cliente=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-cliente:${{ steps.vars.outputs.tag }} \
            mecanica/veiculo=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-veiculo:${{ steps.vars.outputs.tag }} \
            mecanica/funcionario=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-funcionario:${{ steps.vars.outputs.tag }} \
            mecanica/servico=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-servico:${{ steps.vars.outputs.tag }} \
            mecanica/estoque=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-estoque:${{ steps.vars.outputs.tag }} \
            mecanica/atendimento=ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-atendimento:${{ steps.vars.outputs.tag }}

      - name: Apply application manifests
        run: kubectl apply -k k8s/overlays/local

      - name: Wait for rollout
        run: |
          for service in cliente veiculo funcionario servico estoque atendimento; do
            kubectl rollout status deployment/"$service" -n mecanica --timeout=300s
          done

      - name: Show HPA status
        run: kubectl get hpa -n mecanica

      - name: Show Kubernetes diagnostics on failure
        if: failure() && steps.terraform_apply.outcome == 'success'
        run: |
          kubectl get pods,services,hpa -n mecanica -o wide || true
          kubectl get events -n mecanica --sort-by=.lastTimestamp || true
          kubectl describe pods -n mecanica || true

      - name: Terraform destroy (limpeza do cluster efêmero)
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve -input=false
